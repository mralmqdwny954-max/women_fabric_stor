{% extends "admin/base.html" %}


{% block content %}


<div class="page-header">

    <h1>
        تعديل المنتج
    </h1>

</div>



<div class="form-container">


<form 
method="post" 
action="/admin/products/{{ product.id }}/edit"
enctype="multipart/form-data"
>



<label>
كود المنتج
</label>

<input
type="text"
name="product_code"
value="{{ product.product_code }}"
required
>



<label>
اسم المنتج
</label>

<input
type="text"
name="name"
value="{{ product.name }}"
required
>



<label>
الوصف
</label>

<textarea name="description">{{ product.description }}</textarea>



<label>
الصورة الحالية
</label>


{% if product.main_image_path %}

<img 
src="/{{ product.main_image_path }}"
width="150"
height="150"
style="object-fit:cover;border-radius:10px;"
>

{% else %}

لا توجد صورة

{% endif %}



<label>
تغيير الصورة (اختياري)
</label>


<input
type="file"
name="image"
accept="image/*"
>



<label>
السعر الأساسي
</label>

<input
type="number"
step="0.01"
name="regular_price"
value="{{ product.regular_price }}"
>



<label>
سعر الخصم
</label>

<input
type="number"
step="0.01"
name="sale_price"
value="{{ product.sale_price }}"
>



<label>
وحدة البيع
</label>

<input
type="text"
name="sale_unit"
value="{{ product.sale_unit }}"
>



<label>
التصنيف
</label>


<select name="category_id">


{% for category in categories %}


<option value="{{ category.id }}"
{% if category.id == product.category_id %}
selected
{% endif %}
>

{{ category.name }}

</option>


{% endfor %}


</select>



<label>
ظاهر
</label>

<input
type="checkbox"
name="is_visible"
{% if product.is_visible %}
checked
{% endif %}
>



<label>
منتج مميز
</label>

<input
type="checkbox"
name="is_featured"
{% if product.is_featured %}
checked
{% endif %}
>



<label>
منتج جديد
</label>

<input
type="checkbox"
name="is_new"
{% if product.is_new %}
checked
{% endif %}
>



<button 
type="submit"
class="add-btn"
>

حفظ التعديل

</button>



</form>


</div>



{% endblock %}
