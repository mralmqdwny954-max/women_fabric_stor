<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <title>تسجيل دخول الأدمن</title>

    <style>

        body {
            background:#f5f5f5;
            font-family: Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }


        .login-box {

            background:white;
            width:350px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 15px #ccc;

        }


        h2 {

            text-align:center;
            margin-bottom:25px;

        }


        input {

            width:100%;
            padding:12px;
            margin-bottom:15px;
            border-radius:8px;
            border:1px solid #ddd;

        }


        button {

            width:100%;
            padding:12px;
            background:#800020;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;

        }


        .error {

            color:red;
            text-align:center;
            margin-bottom:15px;

        }


    </style>

</head>


<body>


<div class="login-box">


<h2>
دخول لوحة التحكم
</h2>


{% if error %}

<div class="error">

اسم المستخدم أو كلمة المرور غير صحيحة

</div>

{% endif %}



<form method="post" action="/admin/login">


<input 
type="text"
name="username"
placeholder="اسم المستخدم"
required
>


<input 
type="password"
name="password"
placeholder="كلمة المرور"
required
>


<button type="submit">
دخول
</button>


</form>


</div>


</body>

</html>
