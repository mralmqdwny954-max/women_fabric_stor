{% extends "admin/base.html" %}


{% block content %}


<div class="page-header">

    <h1>
        تعديل لون المنتج: {{ product.name }}
    </h1>

</div>



<div class="form-container">


<form 
method="post" 
action="/admin/products/{{ product.id }}/colors/{{ color.id }}/edit"
enctype="multipart/form-data"
>



<label>
اسم اللون
</label>


<input
type="text"
name="color_name"
value="{{ color.color_name }}"
required
>



<label>
صورة اللون الحالية
</label>


{% if color.image_path %}

<img 
src="/{{ color.image_path }}"
width="100"
height="100"
style="object-fit:cover;border-radius:10px;"
>

{% endif %}



<label>
تغيير صورة اللون (اختياري)
</label>


<input
type="file"
name="image"
accept="image/*"
>



<label>
الترتيب
</label>


<input
type="number"
name="display_order"
value="{{ color.display_order }}"
>



<label>
الحالة
</label>


<select name="is_visible">


<option value="true"
{% if color.is_visible %}
selected
{% endif %}
>
ظاهر
</option>



<option value="false"
{% if not color.is_visible %}
selected
{% endif %}
>
مخفي
</option>


</select>



<button
type="submit"
class="add-btn"
>

حفظ التعديل

</button>



</form>


</div>



{% endblock %}
