{% extends "admin/base.html" %}


{% block content %}


<div class="page-header">

    <h1>
        إضافة لون جديد للمنتج: {{ product.name }}
    </h1>

</div>



<div class="form-container">


<form 
method="post" 
action="/admin/products/{{ product.id }}/colors/add"
enctype="multipart/form-data"
>



<label>
اسم اللون
</label>


<input 
type="text"
name="color_name"
placeholder="مثال: أبيض، ذهبي، أسود"
required
>



<label>
صورة اللون
</label>


<input 
type="file"
name="image"
accept="image/*"
required
>



<label>
ترتيب العرض
</label>


<input 
type="number"
name="display_order"
value="0"
>



<label>

<input 
type="checkbox"
name="is_visible"
checked
>

ظاهر

</label>



<button type="submit" class="add-btn">

حفظ اللون

</button>



</form>


</div>



{% endblock %}
